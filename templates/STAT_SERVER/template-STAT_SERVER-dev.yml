scheduled.clear-all-statistics.cron:
  configValueCount: "SINGLE"
  configValueType: "STRING"
  displayName: "Clear All Statistics Cron Expression"
  description: "Cron expression controlling when all accumulated statistics are reset\
    \ (typically midnight daily)"
  sectionName: "SCHEDULED_CLEAR_ALL_STATISTICS_CRON"
  encrypted: false
  rule: null
  restartRequired: false
  defaultValue: "0 0 0 1/1 * ?"
scheduled.config.changed-states-interval:
  configValueCount: "SINGLE"
  configValueType: "LONG"
  displayName: "Changed States Interval (ms)"
  description: "Polling interval in milliseconds for detecting changed agent/queue\
    \ state data"
  sectionName: "SCHEDULED_CHANGED_STATES_INTERVAL_MS"
  encrypted: false
  rule: null
  restartRequired: false
  defaultValue: 10000
scheduled.config.changed-statistics-interval:
  configValueCount: "SINGLE"
  configValueType: "LONG"
  displayName: "Changed Statistics Interval (ms)"
  description: "Polling interval in milliseconds for detecting changed statistics\
    \ data"
  sectionName: "SCHEDULED_CHANGED_STATISTICS_INTERVAL_MS"
  encrypted: false
  rule: null
  restartRequired: false
  defaultValue: 30000
scheduled.config.cron:
  configValueCount: "SINGLE"
  configValueType: "STRING"
  displayName: "Statistics Config Sync Cron Expression"
  description: "Cron expression controlling how frequently statistics configuration\
    \ is synchronized"
  sectionName: "SCHEDULED_CONFIG_CRON"
  encrypted: false
  rule: null
  restartRequired: false
  defaultValue: "0 0/10 * * * ?"
