application.microservice-configuration.hazelcast.discovery-mechanism:
  configValueCount: "SINGLE"
  configValueType: "STRING"
  displayName: "Hazelcast Discovery Mechanism"
  description: "Hazelcast cluster discovery mechanism (e.g. lite_member, native_client)"
  sectionName: "HAZELCAST_DISCOVERY_MECHANISM"
  encrypted: false
  rule: null
  restartRequired: true
  defaultValue: "lite_member"
application.microservice-configuration.hazelcast.lite-member.cluster-members:
  configValueCount: "SINGLE"
  configValueType: "STRING"
  displayName: "Hazelcast Lite Member Cluster Members"
  description: "Comma-separated Eureka service name(s) of the Hazelcast cluster to\
    \ join as a lite member"
  sectionName: "HAZELCAST_LITE_MEMBER_CLUSTER_MEMBERS"
  encrypted: false
  rule: null
  restartRequired: true
  defaultValue: "statserver"
application.microservice-configuration.hazelcast.lite-member.instance-port-padding:
  configValueCount: "SINGLE"
  configValueType: "LONG"
  displayName: "Hazelcast Lite Member Instance Port Padding"
  description: "Port offset added to server.port to determine the Hazelcast member\
    \ port (server.port + padding)"
  sectionName: "HAZELCAST_LITE_MEMBER_PORT_PADDING"
  encrypted: false
  rule: null
  restartRequired: true
  defaultValue: 5701
